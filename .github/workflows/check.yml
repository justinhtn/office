name: Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Branch protection refers to a check by this name, so keep it stable if it is ever required.
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # 3.9 is the oldest Python that scripts/install.sh accepts.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.17.0"
          cache: npm
          cache-dependency-path: web/package-lock.json
      # The plugin tests run through this command. They need no login or API key.
      - run: npm install --global @anthropic-ai/claude-code@2.1.309
      - run: scripts/check.sh
